name: zadachnik
description: "Задачник: задачи с дедлайнами, календарь и подключаемые модули."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: '>=2.6.0 <3.0.0'
  cryptography: ^2.7.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  path_provider: ^2.1.3
  file_picker: '>=8.0.0 <9.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0E1016"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
